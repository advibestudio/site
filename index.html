<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI video ads for Facebook, Instagram, TikTok and WhatsApp Status — ready in 5 days, so you are never late for a sales season." />
    <meta name="theme-color" content="#faf9f4" />
    <title>AdVibe Studio — AI Video Ads Agency</title>
    <!-- Start the connection to YouTube's image server early (the video thumbnails come from there). -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <!-- INSTANT SHELL: this tiny style + the #boot block below paint immediately, before any
         JavaScript has downloaded. React replaces it as soon as the site is ready. -->
    <style>
      html, body { margin: 0; background: #faf9f4; }
      #boot { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; padding: 12px 12px 40px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111412; background: linear-gradient(180deg, #ffe9da, #fff8e6 70%, #faf9f4); }
      #boot .bar { display: flex; align-items: center; gap: 10px; max-width: 1200px; margin: 0 auto; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: 0 12px 30px -18px rgba(17,20,18,.35); }
      #boot .mark { width: 32px; height: 32px; border-radius: 10px; background: #111412; display: grid; place-items: center; }
      #boot .mark i { width: 0; height: 0; border-left: 10px solid #f5a524; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
      #boot .name { font-weight: 800; font-size: 17px; letter-spacing: -.02em; min-height: 44px; display: flex; align-items: center; }
      #boot h1 { max-width: 15ch; margin: clamp(80px, 14vh, 150px) auto 0; padding: 0 12px; text-align: center; font-weight: 800; font-size: clamp(40px, 8vw, 88px); line-height: .96; letter-spacing: -.045em; }
      #boot .dots { display: flex; justify-content: center; gap: 8px; margin-top: 36px; }
      #boot .dots b { width: 9px; height: 9px; border-radius: 50%; background: #f5a524; animation: bootpulse 1s ease-in-out infinite; }
      #boot .dots b:nth-child(2) { animation-delay: .15s; } #boot .dots b:nth-child(3) { animation-delay: .3s; }
      @keyframes bootpulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
      #boot-slow { display: none; margin: 28px auto 0; max-width: 320px; text-align: center; font-size: 15px; color: #586159; line-height: 1.5; }
      #boot-slow a { display: inline-block; margin-top: 10px; padding: 12px 22px; border-radius: 999px; background: #111412; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="bar"><span class="mark"><i></i></span><span class="name" id="boot-b">AdVibe Studio</span></div>
        <h1 id="boot-h">Ads that turn attention into orders.</h1>
        <div class="dots" aria-hidden="true"><b></b><b></b><b></b></div>
        <div id="boot-slow">Your connection looks slow, so this is taking longer than usual.<br /><a href="" onclick="location.reload();return false">Tap to try again</a></div>
        <noscript><p style="text-align:center;margin-top:24px">Please turn on JavaScript to view this website.</p></noscript>
      </div>
    </div>
    <script>
      // Show the last headline/brand we saw (so returning visitors never see stale placeholder text),
      // and reveal a "try again" note if the site still hasn't appeared after 10 seconds.
      (function () {
        try {
          var raw = localStorage.getItem('advibe.content.cache.v1') || localStorage.getItem('advibe.content.v1');
          var c = raw ? JSON.parse(raw) : null;
          if (c && c.hero && c.hero.headline) document.getElementById('boot-h').textContent = c.hero.headline;
          if (c && c.brand && c.brand.name) document.getElementById('boot-b').textContent = c.brand.name;
        } catch (e) {}
        setTimeout(function () { var n = document.getElementById('boot-slow'); if (n) n.style.display = 'block'; }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
